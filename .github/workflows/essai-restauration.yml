name: Essai de restauration

# L'essai de restauration de la 4.5 (docs/tranche-4-contract.md, F561, et
# 10 bis.15) : une base d'essai chez Cloudflare, remplie de deux fermes
# fictives, les scénarios S1, S2 et S3 joués pour de vrai, puis la base
# détruite. Jamais la base des fermes ni celle de la démonstration : les
# gestes refusent tout nom qui ne commence pas par celui de la base d'essai.
#
# Il crée et détruit des bases chez Cloudflare : il ne se lance que sur le
# « vas-y » du porteur, à la main (onglet Actions, une fois ce fichier dans
# main) ou en poussant la branche `essai-restauration`. Il ne se lance jamais
# sur une PR. Aucun artefact : le compte rendu, sans donnée, est dans le
# résumé du flux, prêt à être collé dans la PR.
on:
  workflow_dispatch:
  push:
    branches: [essai-restauration]

permissions:
  contents: read

concurrency:
  group: essai-restauration
  cancel-in-progress: false

jobs:
  essai:
    name: Essai de restauration (base d'essai)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 1
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      # Le jeton n'est donné qu'à cette étape, pas à l'installation des dépendances.
      - name: Jouer l'essai chez Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm backup:rehearse --cloudflare
